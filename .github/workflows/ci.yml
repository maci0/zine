name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    # Pinned OS image: a moving tag changes the compiler, libc and linker
    # under the build, so two runs of one commit are not comparable.
    runs-on: ubuntu-24.04
    # Builds default to ReleaseSafe, which is slower to compile than Debug.
    timeout-minutes: 45
    steps:
      # Pinned by commit SHA (third-party actions execute repo-owned code);
      # update the SHA deliberately when bumping the commented version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Toolchain version comes from build.zig.zon, the same source
      # tests/check.sh reads, so a bump cannot leave CI on another release.
      - id: zig-version
        shell: bash
        run: |
          version=$(sed -n 's/^ *\.minimum_zig_version = "\(.*\)",*$/\1/p' build.zig.zon)
          if [[ -z "$version" ]]; then
            echo "cannot read .minimum_zig_version from build.zig.zon" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The local cache and the pinned package fetch: both are content
      # addressed, so a restored entry is reused only when it still matches.
      # The key therefore covers the toolchain and dependency set only
      # (build.zig.zon); adding src/ to it would save a fresh multi-hundred-MB
      # entry per commit and evict the cache without making any run faster.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
      - run: |
          required=${{ steps.zig-version.outputs.version }}
          if [[ "$(zig version)" != "$required"* ]]; then
            echo "zig $(zig version) is installed, this project requires $required" >&2
            exit 1
          fi
      # Canonical formatter check (mirrors the in-build gate; kept explicit so
      # a formatting failure is reported before any compile work).
      - name: Formatting
        run: bash tests/check.sh fmt
      # Shell helpers: every tracked script must stay shellcheck-clean.
      - name: Shell scripts shellcheck-clean
        run: bash tests/check.sh check_shell
      # The tracked C sources are invisible to the Zig build, so nothing else
      # analyzes them. The three helper steps above and here run out of
      # tests/check.sh, so each command and each file list has one home and a
      # step added there reaches CI without a second copy.
      - name: C sources compile warning-free
        run: bash tests/check.sh check_c
      # Compile every shipped target, not just the default: the compiler is
      # this repo's analyzer, so an error on x86_64/wasm32/wasm64 must block
      # merges exactly like one on x86. Separate steps keep peak memory at a
      # single wasm compile and attribute failures per target.
      - run: zig build --summary all
      - run: zig build -Darch=x86_64 --summary all
      - run: zig build -Darch=wasm32 --summary all
      - run: zig build -Darch=wasm64 --summary all
      # External-stub DLLs (src/dll/, src/win32_dll_api.zig) and the
      # -Dexternal-stubs half of the stub switch are shipped targets the
      # steps above never compile.
      - run: zig build -Ddll=all --summary all
      - run: zig build -Dexternal-stubs --summary all
      - run: zig build test --summary all
      - run: zig build test-cli --summary all
      - run: zig build test-cli -Darch=x86_64 --summary all
      # Untrusted-input parsers: short budget, but they must fail the build
      # when a mutation trips a safety check.
      - run: zig build fuzz -Dfuzz-seconds=60 --summary all
