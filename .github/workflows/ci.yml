name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    # Pinned OS image: a moving tag changes the compiler, libc and linker
    # under the build, so two runs of one commit are not comparable.
    runs-on: ubuntu-24.04
    # Builds default to ReleaseSafe, which is slower to compile than Debug.
    timeout-minutes: 45
    # Sorting, number formatting and the toolchain's own diagnostics follow the
    # ambient locale, and logs follow the ambient timezone. Pinning both keeps
    # a failure here comparable with a run on a developer's machine.
    env:
      LC_ALL: C
      TZ: UTC
    steps:
      # Pinned by commit SHA (third-party actions execute repo-owned code);
      # update the SHA deliberately when bumping the commented version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Toolchain version comes from build.zig.zon, the same source
      # tests/check.sh reads, so a bump cannot leave CI on another release.
      - id: zig-version
        shell: bash
        run: |
          version=$(sed -n 's/^ *\.minimum_zig_version = "\(.*\)",*$/\1/p' build.zig.zon)
          if [[ -z "$version" ]]; then
            echo "cannot read .minimum_zig_version from build.zig.zon" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The local cache and the pinned package fetch: both are content
      # addressed, so a restored entry is reused only when it still matches.
      # The key therefore covers the toolchain and dependency set only
      # (build.zig.zon); adding src/ to it would save a fresh multi-hundred-MB
      # entry per commit and evict the cache without making any run faster.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
      # No separate version check here: tests/check.sh compares the installed
      # `zig version` against build.zig.zon and reports a mismatch before it
      # runs anything, and every step below goes through it.
      #
      # Every gate step below runs out of tests/check.sh, so each command and
      # each file list has one home: a step added to the script's step list
      # reaches CI without a second copy. The step names here are the script's
      # step names, kept one per CI step so a failure names the target that
      # broke; the script runs them in gate order whatever order they are in.
      #
      # Canonical formatter check (mirrors the in-build gate; kept explicit so
      # a formatting failure is reported before any compile work).
      - name: Formatting
        run: bash tests/check.sh fmt
      # Shell helpers: every tracked script must stay shellcheck-clean.
      - name: Shell scripts shellcheck-clean
        run: bash tests/check.sh check_shell
      # The tracked C sources are invisible to the Zig build, so nothing else
      # analyzes them.
      - name: C sources compile warning-free
        run: bash tests/check.sh check_c
      # src/gui/fltk_bridge.cpp is the only tracked C++ source and the Zig
      # build only compiles it under -Dfltk, so without this step nothing in
      # the workflow analyzes it. check-cxx compiles it alone, which needs the
      # FLTK development headers and none of the X11 runtime they come with.
      - name: Install the FLTK development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfltk1.3-dev
      - name: C++ sources compile warning-free
        run: bash tests/check.sh check_cxx
      # Compile every shipped target, not just the default: the compiler is
      # this repo's analyzer, so an error on x86_64/wasm32/wasm64 must block
      # merges exactly like one on x86. Separate steps keep peak memory at a
      # single wasm compile and attribute failures per target.
      - name: Build x86
        run: bash tests/check.sh build
      - name: Build x86_64
        run: bash tests/check.sh build-x86_64
      # The linked artifacts' stack and loader properties, read back out of the
      # binaries rather than taken from build.zig. Both native builds above are
      # cache hits for it.
      - name: Hardening of the linked executables
        run: bash tests/check.sh hardening
      - name: Build wasm32
        run: bash tests/check.sh build-wasm32
      - name: Build wasm64
        run: bash tests/check.sh build-wasm64
      # External-stub DLLs (src/dll/, src/win32_dll_api.zig) and the
      # -Dexternal-stubs half of the stub switch are shipped targets the
      # steps above never compile.
      - name: Build external-stub DLLs
        run: bash tests/check.sh dll
      - name: Build external stubs
        run: bash tests/check.sh external-stubs
      - name: Byte-identical rebuild
        run: bash tests/check.sh reproducible
      - name: Unit tests
        run: bash tests/check.sh test
      - name: CLI tests (x86)
        run: bash tests/check.sh test-cli
      - name: CLI tests (x86_64)
        run: bash tests/check.sh test-cli-x86_64
      # Untrusted-input parsers: short budget locally, but they must fail the
      # build here when a mutation trips a safety check.
      - name: Fuzz parsers
        env:
          ZINE_FUZZ_SECONDS: 60
        run: bash tests/check.sh fuzz
