<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/win2k.css">
</head>
<body>
    <!-- Desktop Background with File Icons -->
    <div id="desktop-area"></div>

    <div id="status">Connecting...</div>

    <!-- Main Application Window -->
    <div id="main-window" class="win2k-window" role="application" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <div class="resize-handle resize-n" data-dir="n"></div>
        <div class="resize-handle resize-s" data-dir="s"></div>
        <div class="resize-handle resize-w" data-dir="w"></div>
        <div class="resize-handle resize-e" data-dir="e"></div>
        <div class="resize-handle resize-nw" data-dir="nw"></div>
        <div class="resize-handle resize-ne" data-dir="ne"></div>
        <div class="resize-handle resize-sw" data-dir="sw"></div>
        <div class="resize-handle resize-se" data-dir="se"></div>
        <div class="win2k-titlebar" id="main-titlebar">
            <div class="win2k-titlebar-text">
                <img id="titlebar-icon" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="width: 16px; height: 16px; display: none;">
                <span id="window-title" dir="auto"></span>
            </div>
            <div class="win2k-titlebar-buttons">
                <button class="win2k-titlebar-btn" onclick="minimizeWindow()" aria-label="Minimize"><span class="btn-glyph btn-minimize"></span></button>
                <button class="win2k-titlebar-btn" onclick="maximizeWindow()" aria-label="Maximize"><span class="btn-glyph btn-maximize"></span></button>
                <button class="win2k-titlebar-btn" onclick="closeWindow()" aria-label="Close"><span class="btn-glyph btn-close"></span></button>
            </div>
        </div>
        <div id="menu-bar" role="menubar"></div>
        <div id="game-container">
            <div class="canvas-inset">
                <canvas id="screen" aria-label="Application display"></canvas>
                <textarea id="edit-control" dir="auto" aria-label="Text editor" style="display:none;"></textarea>
            </div>
        </div>
    </div>

    <!-- Dialog Overlay -->
    <div id="dialog-overlay" class="win2k-window win2k-dialog" role="dialog" aria-labelledby="dialog-title">
        <div class="win2k-titlebar" id="dialog-titlebar">
            <div class="win2k-titlebar-text">
                <span id="dialog-title" dir="auto">Dialog</span>
            </div>
            <div class="win2k-titlebar-buttons">
                <button class="win2k-titlebar-btn" onclick="closeDialog()" aria-label="Close dialog"><span class="btn-glyph btn-close"></span></button>
            </div>
        </div>
        <div class="win2k-content" id="dialog-content"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button type="button" class="taskbar-start" id="start-button" aria-haspopup="true" aria-expanded="false">
            <img src="assets/start.svg" class="win-flag" width="16" height="16" alt="">
            <span>Start</span>
        </button>
        <div class="taskbar-window-btn active" id="taskbar-app-btn">
            <img id="taskbar-icon" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="width: 16px; height: 16px; display: none;">
            <span id="taskbar-title" dir="auto"></span>
        </div>
        <div class="taskbar-tray">
            <button type="button" class="tray-volume" id="tray-volume" aria-label="Volume" onclick="toggleVolumePopup(event)">
                <svg viewBox="0 0 16 16" width="16" height="16" class="volume-icon">
                    <polygon points="2,6 2,10 5,10 9,13 9,3 5,6" fill="currentColor"/>
                    <path id="vol-wave1" d="M10,5.5 Q12,8 10,10.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
                    <path id="vol-wave2" d="M11,3.5 Q14,8 11,12.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
                    <line id="vol-mute-line" x1="2" y1="3" x2="14" y2="13" stroke="red" stroke-width="2" style="display:none"/>
                </svg>
            </button>
            <div class="volume-popup" id="volume-popup">
                <div class="volume-popup-title">Volume</div>
                <div class="volume-slider-container">
                    <div class="volume-label-hi">High</div>
                    <input type="range" id="volume-slider" min="0" max="100" value="100"
                           class="volume-range" aria-label="Volume"
                           oninput="onVolumeSliderChange(this.value)">
                    <div class="volume-label-lo">Low</div>
                </div>
                <label class="volume-mute-label">
                    <input type="checkbox" id="volume-mute" onchange="onMuteToggle(this.checked)">
                    Mute
                </label>
            </div>
        </div>
        <div class="taskbar-clock" id="taskbar-clock"></div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="taskbar-context-menu"></div>

    <!-- Taskbar Right-Click Context Menu -->
    <div id="taskbar-context-menu" class="taskbar-context-menu"></div>

    <script>
        // Both scripts are deferred, so a load failure is indistinguishable
        // from a slow guest: the status line would sit on "Connecting..."
        // forever. Report it instead.
        function assetFailed(name) {
            const status = document.getElementById('status');
            status.textContent = 'Failed to load ' + name + '. Reload the page to try again.';
            status.classList.add('error');
            status.style.display = 'block';
        }
    </script>
    <script defer src="/van.min.js" onerror="assetFailed('van.min.js')"></script>
    <script defer src="/app.js" onerror="assetFailed('app.js')"></script>
</body>
</html>
