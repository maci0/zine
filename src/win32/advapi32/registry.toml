# Zine Registry Configuration
# Read-only registry key/value pairs served to Win32 applications.
# Keys use Windows registry path format with backslash separators.
# Supports REG_SZ (string) and REG_DWORD (integer) value types.

# CPU identification (read by cpuidsdk.dll and various system info tools)
["HKLM\\HARDWARE\\DESCRIPTION\\System\\CentralProcessor\\0"]
ProcessorNameString = "Intel Pentium III"
Identifier = "x86 Family 6 Model 8 Stepping 3"
VendorIdentifier = "GenuineIntel"
"~MHz" = 1000
FeatureSet = 0x2FFF

# MSVC 6.0 installation paths (read by CL.EXE, LINK.EXE, MIDL.EXE, etc.)
["HKLM\\Software\\Microsoft\\DevStudio\\6.0\\Products\\Microsoft Visual C++"]
ProductDir = "C:\\MSVC600\\VC98"

["HKLM\\Software\\Microsoft\\VisualStudio\\6.0\\Setup"]
VsCommonDir = "C:\\MSVC600\\Common"

["HKLM\\Software\\Microsoft\\VisualStudio\\6.0\\Setup\\Microsoft Visual C++"]
ProductDir = "C:\\MSVC600\\VC98"

# Windows version info
["HKLM\\Software\\Microsoft\\Windows NT\\CurrentVersion"]
CurrentVersion = "5.0"
CurrentBuildNumber = "2195"
ProductName = "Microsoft Windows 2000"
CSDVersion = "Service Pack 4"

# System environment (read by various apps for temp directory)
["HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Environment"]
TEMP = "C:\\TEMP"
TMP = "C:\\TEMP"
